name: Check

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read
  actions: write

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Production JavaScript audit
        run: pnpm audit:frontend

      - name: Check version consistency
        run: node scripts/release-manifest.mjs check

      - name: Quality gates
        run: pnpm check:ci

      - name: Record benchmark gate
        if: always() && !cancelled()
        run: node scripts/quality-reports.mjs

      - name: Upload test results
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: test-results/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage report
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload benchmark status
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: benchmark-results/**
          if-no-files-found: warn
          retention-days: 14

      - name: Rust advisory audit
        if: always() && !cancelled()
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
