[package]
name = "savage"
version = "0.1.0"
description = "SaVaGe — Image to SVG converter and vector editor"
authors = ["SaVaGe"]
edition = "2021"

[lib]
name = "savage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
vtracer = "0.6"
visioncortex = "0.8"
i_overlay = "7"
resvg = "0.45"
anyhow = "1"
thiserror = "2"
base64 = "0.22"
